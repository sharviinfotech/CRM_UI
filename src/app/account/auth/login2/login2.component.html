<div class="full-screen-background">
  <img [src]="images[currentIndex]" alt="Background Slide" class="background-img">

  <div class="login-container">
    <div class="login-card">
      <div class="form-wrapper">

        <form *ngIf="!isForgotPassword" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
          <div class="form-group">
            <label for="userName">User</label>
            <input type="text" class="form-control" formControlName="userName" placeholder="Enter User Name">
            <div class="text-danger" *ngIf="submitted && f['userName'].errors">
              User Name is required.
            </div>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <div class="password-wrapper">
              <input [type]="fieldTextType ? 'text' : 'password'" 
                    class="form-control" 
                    formControlName="password" 
                    placeholder="Enter password">
              <button type="button" class="btn-password-toggle" (click)="toggleFieldTextType()">
                <i class="mdi" [ngClass]="{'mdi-eye-off-outline': !fieldTextType, 'mdi-eye-outline': fieldTextType}"></i>
              </button>
            </div>
            <div class="text-danger" *ngIf="submitted && f['password'].errors">
              Password is required.
            </div>
          </div>

<!--           
          <div class="form-group">
            <label for="language">Language</label>
            <select class="form-control" formControlName="language">
              <option value="" disabled>Select Language</option>
              <option value="en">EN - English</option>
              <option value="hi">HI - Hindi</option>
              <option value="te">TE - Telugu</option>
              <option value="ta">TA - Tamil</option>
            </select>
            <div class="text-danger" *ngIf="submitted && f['language'].errors">
              Language is required.
            </div>
          </div> -->

          <!-- <div class="form-group">
            <label for="client">Client</label>
            <input type="text" class="form-control" formControlName="client" placeholder="Enter Client Name">
            <div class="text-danger" *ngIf="submitted && f['client'].errors">
              Client Name is required.
            </div>
          </div> -->

          <div class="d-grid gap-2 button-group">
            <button class="btn btn-primary" type="submit">Log On</button>
            <button class="btn btn-secondary" type="button">Change Password</button>
          </div>
        </form>

        <form *ngIf="isForgotPassword" [formGroup]="forgotPasswordForm" (ngSubmit)="onForgotPasswordSubmit()">
          <div class="form-group">
            <label for="email">Enter your Email</label>
            <input type="email" class="form-control" formControlName="email" placeholder="Enter your email">
            <div class="text-danger" *ngIf="submittedForgot && gForgot['email'].errors">
              Valid email is required.
            </div>
          </div>
          <div class="d-grid mt-3">
            <button class="btn btn-success" type="submit">Submit</button>
          </div>
          <div class="mt-3 text-center">
            <a (click)="toggleForgotPassword()" class="pointer-underline text-white">Back to Login</a>
          </div>
        </form>

      </div>
    </div>
    <div class="copyright-section">
      <img src="assets/images/sharvi-logo.jpg" alt="SAP Logo" class="sap-logo">
      <p>Copyright © {{year}} Sharviinfotech All Rights Reserved.</p>
    </div>
  </div>
</div>
